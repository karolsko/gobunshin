name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - uses: ./
        with:
          args: release
