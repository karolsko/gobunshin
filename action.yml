name: gobunshin
description: Build, package, and publish a Go release
author: Karol Skoczyk
branding:
  icon: package
  color: blue

inputs:
  version:
    description: Version to install, such as v1.2.3 or latest. Empty builds the action checkout.
    required: false
    default: ""
  args:
    description: Arguments passed to gobunshin. Words are split on spaces.
    required: false
    default: release
  workdir:
    description: Working directory. Relative paths start at the workspace root.
    required: false
    default: "."
  token:
    description: Token exported as GITHUB_TOKEN. Defaults to the workflow token.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Run gobunshin
      shell: bash
      env:
        GOBUNSHIN_VERSION: ${{ inputs.version }}
        GOBUNSHIN_ARGS: ${{ inputs.args }}
        GOBUNSHIN_WORKDIR: ${{ inputs.workdir }}
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
      run: bash "${{ github.action_path }}/scripts/action.sh"
